<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, minimum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#667eea">
    <meta name="screen-orientation" content="portrait">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'><defs><style>.fg{fill:%23667eea}.bg{fill:%23764ba2}</style></defs><circle class='bg' cx='64' cy='64' r='64'/><circle class='fg' cx='64' cy='64' r='56'/><circle fill='%23fff' cx='64' cy='64' r='50'/><circle cx='64' cy='28' r='4' fill='%23667eea'/><circle cx='90' cy='64' r='4' fill='%23667eea'/><path d='M64,64 L64,40 L68,40' stroke='%23667eea' stroke-width='3' fill='none' stroke-linecap='round'/><path d='M64,64 L82,76' stroke='%23764ba2' stroke-width='3' fill='none' stroke-linecap='round'/></svg>"
    title="Favicon - Clock Icon">
    <title>Login - Página em Manutenção</title>
    <link rel="stylesheet" href="estilos/style.css">
</head>
<body>
    <!-- Container de Login -->
    <div class="login-container" id="loginContainer">
        <div class="login-box">
            <h1>Acesso Restrito</h1>
            <p class="subtitle">A página estará disponível em breve</p>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">Usuário:</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="Digite seu usuário"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label for="password">Senha:</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Digite sua senha"
                        required
                    >
                </div>
                
                <button type="submit" class="btn-login">Entrar</button>
            </form>
            
            <!--<p class="demo-text">Use qualquer usuário e senha para testar</p>-->
        </div>
    </div>

    <!-- Container de Countdown -->
    <div class="countdown-container hidden" id="countdownContainer">
        <video class="countdown-video" id="backgroundVideo" autoplay muted loop playsinline>
            <source src="video/video.mp4" type="video/mp4">
            Seu navegador não suporta vídeos HTML5
        </video>
        <div class="countdown-box">
            <h1>Bem-vindo!</h1>
            <p class="countdown-subtitle">A página completa será lançada em:</p>
            
            <div class="countdown" id="countdown">
                <div class="countdown-item">
                    <span class="countdown-value" id="days">00</span>
                    <span class="countdown-label">Dias</span>
                </div>
                <div class="countdown-item">
                    <span class="countdown-value" id="hours">00</span>
                    <span class="countdown-label">Horas</span>
                </div>
                <div class="countdown-item">
                    <span class="countdown-value" id="minutes">00</span>
                    <span class="countdown-label">Minutos</span>
                </div>
                <div class="countdown-item">
                    <span class="countdown-value" id="seconds">00</span>
                    <span class="countdown-label">Segundos</span>
                </div>
            </div>
            
            <div class="user-info">
                <p>Você está logado como: <strong id="userDisplay"></strong></p>
            </div>
            
            <button class="btn-logout" id="logoutBtn">Sair</button>
        </div>
    </div>

    <script src="/scripts/script.js"></script>
</body>
</html>
